# ---------------------------------------------------------------
# SAST (análisis estático): revisa el CÓDIGO sin ejecutarlo, en cada git push.
#   Bandit     -> busca código Python inseguro (contraseñas en el código, eval, SQL armado a mano...)
#   Semgrep    -> reglas de seguridad para Django y React (XSS, inyecciones, malas prácticas)
#   pip-audit  -> librerías de Python con vulnerabilidades conocidas (CVE)
#   npm audit  -> librerías de JavaScript con vulnerabilidades conocidas (CVE)
# Además corre las pruebas del backend. Si algo falla, el commit queda marcado en rojo.
# Resultados: pestaña "Actions" del repositorio en GitHub.
# ---------------------------------------------------------------
name: SAST - Análisis estático

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # botón "Run workflow" para ejecutarlo a mano

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Bandit, pip-audit y pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Valores de prueba: el análisis no se conecta a la base de datos real
      SECRET_KEY: clave-solo-para-ci
      DB_NAME: ci
      DB_USER: ci
      DB_PASSWORD: ci
      DB_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar herramientas y librerías
        run: |
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Bandit (código Python inseguro, severidad media o alta)
        run: bandit -r . -x ./venv,./media,./staticfiles -ll

      - name: Informe completo de Bandit (HTML)
        if: always()
        run: bandit -r . -x ./venv,./media,./staticfiles -f html -o ../bandit.html --exit-zero

      - name: pip-audit (librerías con vulnerabilidades conocidas)
        run: pip-audit -r requirements.txt --desc

      - name: Pruebas del backend
        run: python manage.py test --settings=config.test_settings

      - name: Guardar informe de Bandit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-bandit
          path: bandit.html

  frontend:
    name: Frontend (npm audit y compilación)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: npm audit (librerías con vulnerabilidades altas o críticas)
        run: npm audit --audit-level=high
      - name: Compilar React
        run: npm run build

  semgrep:
    name: Semgrep (Django y React)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        run: >
          semgrep scan
          --config p/python --config p/django --config p/javascript --config p/react
          --exclude node_modules --exclude dist --exclude migrations
          --metrics=off --error --severity ERROR
          --sarif --output semgrep.sarif
      - name: Mostrar hallazgos
        if: always()
        run: >
          semgrep scan
          --config p/python --config p/django --config p/javascript --config p/react
          --exclude node_modules --exclude dist --exclude migrations
          --metrics=off
      - name: Guardar informe de Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-semgrep
          path: semgrep.sarif
