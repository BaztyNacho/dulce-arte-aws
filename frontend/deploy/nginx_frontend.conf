# Nginx del FRONTEND de Dulce Arte (React ya compilado en la carpeta dist/).
# Se instala en: /etc/nginx/sites-available/dulce_frontend  (lo hace configurar_nginx.sh)
#
# - Sirve los archivos de React (HTML, JS, CSS e imágenes del diseño).
# - Cualquier ruta (/pedidos, /cocina...) devuelve index.html: React decide qué pantalla mostrar.
# - /api, /admin, /media y /static NO llegan aquí: la API Gateway los envía al backend y a S3.

server {
    listen 80 default_server;
    server_name _;

    root /home/ubuntu/dulce-arte-aws/frontend/dist;
    index index.html;

    # REVISION_GATEWAY (configurar_nginx.sh reemplaza esta línea si se usa la cabecera secreta)

    # Archivos con huella en el nombre (index-AbC123.js): se guardan en caché por un año
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rutas de React: si no existe el archivo, se entrega index.html (sin caché)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
