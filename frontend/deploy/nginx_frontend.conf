# Nginx del FRONTEND de Dulce Arte (React ya compilado en la carpeta dist/).
# Se instala en: /etc/nginx/sites-available/dulce_frontend  (lo hace instalar_frontend.sh)
#
# - Sirve los archivos de React (HTML, JS, CSS e imágenes del diseño).
# - Cualquier ruta (/pedidos, /cocina...) devuelve index.html: React decide qué pantalla mostrar.
# - SOLO PARA PROBAR ANTES DE LA API GATEWAY: /api, /admin, /static y /media se reenvían al
#   backend. En la Etapa 5 la API Gateway enviará esas rutas directo al backend y a S3,
#   así que estas peticiones ya no llegarán aquí.

server {
    listen 80 default_server;
    server_name _;

    root /home/ubuntu/dulce-arte-aws/frontend/dist;
    index index.html;

    # Archivos con huella en el nombre (index-AbC123.js): se guardan en caché por un año
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Puente temporal al backend (Etapa 4). IP_BACKEND la reemplaza instalar_frontend.sh
    location ~ ^/(api|admin|static|media)/ {
        proxy_pass http://IP_BACKEND;
        proxy_set_header Host IP_BACKEND;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10M;
    }

    # Rutas de React: si no existe el archivo, se entrega index.html (sin caché)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
