# Cabeceras de seguridad del frontend (se incluyen en cada "location" de nginx_frontend.conf).
# Las recomiendan los análisis DAST como OWASP ZAP.

# El navegador usará siempre HTTPS con este sitio durante un año (HSTS)
add_header Strict-Transport-Security "max-age=31536000" always;
# No adivinar el tipo de archivo (evita ejecutar un archivo como si fuera script)
add_header X-Content-Type-Options "nosniff" always;
# Nadie puede mostrar Dulce Arte dentro de un iframe (evita clickjacking)
add_header X-Frame-Options "DENY" always;
# Al salir del sitio no se envía la dirección completa de la página
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# El sitio no usa micrófono, cámara en vivo ni ubicación
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Aísla la ventana de Dulce Arte de ventanas de otros sitios (COOP) y evita que otros sitios
# incrusten nuestros archivos (CORP). No se usa COEP require-corp porque bloquearía el mapa de Google.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Política de contenido (CSP): de dónde se pueden cargar scripts, estilos, fuentes e imágenes.
# Todo viene de nuestra propia dirección (React, fotos y fuentes en S3 por la API Gateway):
#   script-src 'self' -> solo los scripts propios (bloquea scripts inyectados: XSS)
#   style-src  'self' -> solo nuestras hojas de estilo, sin estilos en línea
#   frame-src         -> solo el mapa de Google Maps
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-src https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
