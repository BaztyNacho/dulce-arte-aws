# Nginx del BACKEND de Dulce Arte.
# Recibe las peticiones que le reenvía la API Gateway y se las pasa a Gunicorn (Django).
# Ya no sirve /static/ ni /media/: esos archivos están en Amazon S3.
# Se instala en: /etc/nginx/sites-available/dulce_backend  (lo hace instalar_backend.sh)

server {
    listen 80 default_server;
    server_name _;

    # Fotos de comprobantes tomadas con el celular (la API Gateway acepta hasta 10 MB)
    client_max_body_size 10M;

    location / {
        proxy_pass http://unix:/run/gunicorn/dulce_arte.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Si la API Gateway avisó que la conexión original fue HTTPS, se respeta
        set $proto $http_x_forwarded_proto;
        if ($proto = "") { set $proto $scheme; }
        proxy_set_header X-Forwarded-Proto $proto;
        proxy_read_timeout 60s;
    }
}
