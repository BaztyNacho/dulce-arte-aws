# ---------------------------------------------------------------
# Configuración del análisis automático de SonarQube Cloud (SAST)
# https://sonarcloud.io  ->  proyecto dulce-arte-aws
# ---------------------------------------------------------------

# Código que se analiza: backend (Django), frontend (React) y la función Lambda
sonar.sources=backend,frontend/src,frontend/deploy,lambda

# Archivos que no se analizan: migraciones generadas por Django, librerías y archivos compilados
sonar.exclusions=**/migrations/**,**/node_modules/**,frontend/dist/**,backend/staticfiles/**,backend/recursos/fuentes/**,**/tests.py

# Las pruebas automáticas se reconocen como pruebas (no como código de la aplicación)
sonar.tests=backend
sonar.test.inclusions=**/tests.py

# Versión de Python del backend
sonar.python.version=3.13
